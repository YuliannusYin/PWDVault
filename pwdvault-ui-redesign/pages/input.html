    <style id="theme-vars">
/* ═══════════════════════════════════════════════════════════════
   PwdVault — Brand Design Tokens
   视觉路线：自由品牌化（保险库气质）  强调色：信任蓝
   主题：深浅双模式（默认深色，顶栏切换）
   字体：Segoe UI Variable（Windows 桌面应用）
   ═══════════════════════════════════════════════════════════════ */

/* ── 浅色主题（默认 :root） ── */
:root {
  --pv-background: #f5f8fc;
  --pv-foreground: #0f1626;

  --pv-card: #ffffff;
  --pv-card-foreground: #0f1626;

  --pv-popover: #ffffff;
  --pv-popover-foreground: #0f1626;

  --pv-sidebar: #ffffff;
  --pv-sidebar-foreground: #0f1626;
  --pv-sidebar-border: #e6ebf3;

  --pv-primary: #2f5fff;
  --pv-primary-foreground: #ffffff;

  --pv-muted: #eef2f8;
  --pv-muted-foreground: #5c6678;

  --pv-border: #e2e8f2;
  --pv-input: #ffffff;
  --pv-ring: #2f5fff;

  /* 选中态/悬停态：仅用主色透明度，不引入第二品牌色相 */
  --pv-accent: rgba(47, 95, 255, 0.10);
  --pv-accent-strong: rgba(47, 95, 255, 0.16);
  --pv-accent-foreground: #0f1626;

  /* 语义状态色（仅用于真实状态） */
  --pv-success: #1f9d57;
  --pv-success-foreground: #ffffff;
  --pv-success-soft: rgba(31, 157, 87, 0.12);
  --pv-warning: #c9820a;
  --pv-warning-foreground: #ffffff;
  --pv-warning-soft: rgba(201, 130, 10, 0.12);
  --pv-error: #dc2626;
  --pv-error-foreground: #ffffff;
  --pv-error-soft: rgba(220, 38, 38, 0.12);
  --pv-info: #2f5fff;
  --pv-info-soft: rgba(47, 95, 255, 0.12);

  /* 圆角 */
  --pv-radius-sm: 6px;
  --pv-radius-md: 8px;
  --pv-radius-lg: 12px;
  --pv-radius-full: 9999px;

  /* 字体 */
  --pv-font-sans: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system,
    "Helvetica Neue", Arial, sans-serif;
  --pv-font-mono: "Cascadia Code", "SFMono-Regular", "Consolas", monospace;

  /* 阴影：浮层（弹窗/下拉/抽屉）专用，静态卡片用边框分层 */
  --pv-shadow-popover: 0 8px 24px -6px rgba(15, 22, 38, 0.18),
    0 2px 8px -2px rgba(15, 22, 38, 0.08);
  --pv-shadow-overlay: 0 24px 56px -12px rgba(15, 22, 38, 0.32),
    0 8px 24px -8px rgba(15, 22, 38, 0.16);

  /* 尺寸 */
  --pv-sidebar-width: 232px;
  --pv-topbar-height: 56px;
}

/* ── 深色主题（保险库氛围，<html class="dark">） ── */
.dark {
  --pv-background: #0a0e1a;
  --pv-foreground: #e8ecf4;

  --pv-card: #121829;
  --pv-card-foreground: #e8ecf4;

  --pv-popover: #161e33;
  --pv-popover-foreground: #e8ecf4;

  --pv-sidebar: #0d1322;
  --pv-sidebar-foreground: #e8ecf4;
  --pv-sidebar-border: #1e2740;

  --pv-primary: #3b6bff;
  --pv-primary-foreground: #ffffff;

  --pv-muted: #1a2238;
  --pv-muted-foreground: #8b95a8;

  --pv-border: #232c44;
  --pv-input: #1a2238;
  --pv-ring: #3b6bff;

  --pv-accent: rgba(59, 107, 255, 0.16);
  --pv-accent-strong: rgba(59, 107, 255, 0.24);
  --pv-accent-foreground: #e8ecf4;

  --pv-success: #2bd576;
  --pv-success-foreground: #06281a;
  --pv-success-soft: rgba(43, 213, 118, 0.14);
  --pv-warning: #f0a93c;
  --pv-warning-foreground: #2a1a02;
  --pv-warning-soft: rgba(240, 169, 60, 0.14);
  --pv-error: #f56363;
  --pv-error-foreground: #2a0808;
  --pv-error-soft: rgba(245, 99, 99, 0.14);
  --pv-info: #3b6bff;
  --pv-info-soft: rgba(59, 107, 255, 0.16);

  --pv-shadow-popover: 0 8px 24px -6px rgba(0, 0, 0, 0.55),
    0 2px 8px -2px rgba(0, 0, 0, 0.4);
  --pv-shadow-overlay: 0 24px 56px -12px rgba(0, 0, 0, 0.7),
    0 8px 24px -8px rgba(0, 0, 0, 0.5);
}

/* ── 基础排版 ── */
html,
body {
  font-family: var(--pv-font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* 滚动条：贴合桌面应用，纤细低调 */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--pv-border) transparent;
}
*::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
*::-webkit-scrollbar-thumb {
  background: var(--pv-border);
  border-radius: var(--pv-radius-full);
}
*::-webkit-scrollbar-track {
  background: transparent;
}

/* 主题切换微动画 */
.theme-anim,
.theme-anim * {
  transition: background-color 0.18s ease, border-color 0.18s ease,
    color 0.18s ease;
}

<body class="min-h-screen font-sans antialiased">
    <main>
      <div data-viewport-mode="app-shell" class="h-screen flex overflow-hidden min-h-0 bg-background">
        <!-- 侧边栏 -->
        <aside class="w-[232px] shrink-0 bg-[var(--pv-sidebar)] border-r border-[var(--pv-sidebar-border)] flex flex-col">
          <!-- 品牌块 -->
          <div class="px-[18px] py-5 flex items-center gap-2.5">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--pv-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0" aria-hidden="true">
              <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
            </svg>
            <span class="text-[15px] font-semibold text-[var(--pv-sidebar-foreground)]">PwdVault</span>
          </div>
          <!-- 导航 -->
          <nav class="px-3 py-3 space-y-1" aria-label="主导航">
            <button type="button" data-dom-id="nav-book" class="w-full h-10 rounded-md px-3 flex items-center gap-3 text-sm text-muted-foreground hover:bg-muted hover:text-foreground transition-colors">
              <i data-lucide="key-round" class="w-[18px] h-[18px] shrink-0"></i>
              <span class="truncate">密码本</span>
            </button>
            <button type="button" data-dom-id="nav-input" class="relative w-full h-10 rounded-md px-3 flex items-center gap-3 text-sm bg-accent text-foreground transition-colors before:content-[''] before:absolute before:left-0 before:inset-y-2 before:w-[3px] before:rounded-full before:bg-[var(--pv-primary)]">
              <i data-lucide="file-plus-2" class="w-[18px] h-[18px] shrink-0"></i>
              <span class="truncate">录入</span>
            </button>
            <button type="button" data-dom-id="nav-generator" class="w-full h-10 rounded-md px-3 flex items-center gap-3 text-sm text-muted-foreground hover:bg-muted hover:text-foreground transition-colors">
              <i data-lucide="wand-2" class="w-[18px] h-[18px] shrink-0"></i>
              <span class="truncate">生成器</span>
            </button>
            <button type="button" data-dom-id="nav-settings" class="w-full h-10 rounded-md px-3 flex items-center gap-3 text-sm text-muted-foreground hover:bg-muted hover:text-foreground transition-colors">
              <i data-lucide="settings" class="w-[18px] h-[18px] shrink-0"></i>
              <span class="truncate">设置</span>
            </button>
          </nav>
          <!-- 底部状态 + 锁定 -->
          <div class="mt-auto px-[18px] py-4 border-t border-[var(--pv-sidebar-border)]">
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-[var(--pv-success)] shrink-0" aria-hidden="true"></span>
              <span class="text-xs text-muted-foreground truncate">服务已连接</span>
            </div>
            <button type="button" data-dom-id="action-lock" class="mt-3 w-full h-9 rounded-md border border-border bg-transparent flex items-center justify-center gap-2 text-sm text-muted-foreground hover:bg-muted hover:text-foreground transition-colors">
              <i data-lucide="lock" class="w-[16px] h-[16px]"></i>
              <span class="truncate">锁定保险库</span>
            </button>
          </div>
        </aside>

        <!-- 主区域 -->
        <div class="flex-1 flex flex-col min-w-0">
          <!-- 顶栏 -->
          <header class="h-14 shrink-0 px-6 flex items-center justify-between border-b border-border">
            <div class="flex items-baseline min-w-0">
              <h1 class="text-base font-semibold text-foreground truncate">录入</h1>
              <span class="ml-3 text-[13px] text-muted-foreground truncate">新建一条密码记录</span>
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <button type="button" data-dom-id="theme-toggle" class="w-9 h-9 flex items-center justify-center rounded-md text-muted-foreground hover:bg-muted hover:text-foreground transition-colors" aria-label="切换主题" aria-pressed="true">
                <i data-lucide="sun" class="w-[18px] h-[18px]"></i>

              <button type="button" data-dom-id="action-lock" class="w-9 h-9 flex items-center justify-center rounded-md text-muted-foreground hover:bg-muted hover:text-foreground transition-colors" aria-label="锁定保险库">
                <i data-lucide="lock" class="w-[18px] h-[18px]"></i>
              </button>
            </div>

            <div class="max-w-[640px] mx-auto bg-card border border-border rounded-lg p-8">
              <h2 class="text-lg font-semibold text-card-foreground">新增密码条目</h2>
              <p class="mt-1 text-[13px] text-muted-foreground">所有字段加密存储于本地</p>

              <form class="mt-6 space-y-5" novalidate>
                <!-- 网站 -->
                <div>
                  <label for="field-site" class="block text-sm font-medium mb-1.5 text-foreground">网站 <span class="text-[var(--pv-error)]">*</span></label>
                  <div class="relative">
                    <i data-lucide="globe" class="w-[18px] h-[18px] absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground pointer-events-none"></i>
                    <input id="field-site" type="text" placeholder="example.com" class="h-10 w-full bg-input border border-border rounded-md pl-10 pr-3 text-sm text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring/40 focus:border-primary transition-colors">
                  </div>
                </div>
                <!-- 用户名 -->
                <div>
                  <label for="field-user" class="block text-sm font-medium mb-1.5 text-foreground">用户名 <span class="text-[var(--pv-error)]">*</span></label>
                  <div class="relative">
                    <i data-lucide="at-sign" class="w-[18px] h-[18px] absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground pointer-events-none"></i>
                    <input id="field-user" type="text" placeholder="用户名或邮箱" class="h-10 w-full bg-input border border-border rounded-md pl-10 pr-3 text-sm text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring/40 focus:border-primary transition-colors">
                  </div>
                </div>
                <!-- 密码 -->
                <div>
                  <label for="field-pwd" class="block text-sm font-medium mb-1.5 text-foreground">密码 <span class="text-[var(--pv-error)]">*</span></label>
                  <div class="relative">
                    <i data-lucide="key" class="w-[18px] h-[18px] absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground pointer-events-none"></i>
                    <input id="field-pwd" data-dom-id="input-pwd" type="password" value="••••••••••" class="h-10 w-full bg-input border border-border rounded-md pl-10 pr-24 text-sm text-foreground font-[var(--pv-font-mono)] focus:outline-none focus:ring-2 focus:ring-ring/40 focus:border-primary transition-colors">
                    <div class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center gap-1">
                      <button type="button" data-dom-id="action-generate" class="flex items-center gap-1 h-7 px-2 rounded-md text-xs text-muted-foreground hover:bg-muted hover:text-foreground transition-colors">
                        <i data-lucide="wand-2" class="w-[14px] h-[14px]"></i>
                        <span>生成</span>
                      </button>
                      <button type="button" data-dom-id="toggle-pwd-visibility" class="w-7 h-7 flex items-center justify-center rounded-md text-muted-foreground hover:bg-muted hover:text-foreground transition-colors" aria-label="显示密码">
                        <i data-lucide="eye" class="w-[16px] h-[16px]"></i>
                      </button>
                    </div>
                  </div>
                  <!-- 强度条 -->
                  <div class="mt-2 flex items-center gap-2">
                    <div class="flex-1 flex gap-1" role="progressbar" aria-label="密码强度" aria-valuenow="4" aria-valuemin="0" aria-valuemax="4">
                      <div class="h-1 flex-1 rounded-full bg-[var(--pv-success)]"></div>
                      <div class="h-1 flex-1 rounded-full bg-[var(--pv-success)]"></div>
                      <div class="h-1 flex-1 rounded-full bg-[var(--pv-success)]"></div>
                      <div class="h-1 flex-1 rounded-full bg-[var(--pv-success)] opacity-50"></div>
                    </div>
                    <span class="text-xs text-[var(--pv-success)] shrink-0">强度：强</span>
                  </div>
                </div>
                <!-- 备注 -->
                <div>
                  <label for="field-notes" class="block text-sm font-medium mb-1.5 text-foreground">备注</label>
                  <textarea id="field-notes" placeholder="可选：备注、恢复码、安全问题…" class="h-24 w-full bg-input border border-border rounded-md p-3 text-sm text-foreground placeholder:text-muted-foreground resize-none focus:outline-none focus:ring-2 focus:ring-ring/40 focus:border-primary transition-colors"></textarea>
                </div>
              </form>

              <!-- 错误提示（默认隐藏） -->
              <div data-dom-id="form-error" class="hidden mt-4 text-sm text-[var(--pv-error)] flex items-center gap-1.5">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                <span>保存失败：请检查必填字段是否完整。</span>
              </div>

              <!-- 底部操作 -->
              <div class="mt-7 pt-5 border-t border-border flex justify-end gap-3">
                <button type="button" data-dom-id="action-clear" class="h-10 px-4 flex items-center gap-2 rounded-md border border-border bg-transparent text-sm text-foreground hover:bg-muted transition-colors">
                  <i data-lucide="eraser" class="w-[16px] h-[16px]"></i>
                  <span>清除</span>
                </button>
                <button type="button" data-dom-id="action-save" class="h-10 px-5 flex items-center gap-2 rounded-md bg-primary text-primary-foreground text-sm font-medium hover:opacity-90 transition-opacity">
                  <i data-lucide="save" class="w-[16px] h-[16px]"></i>
                  <span>保存条目</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
document.addEventListener('DOMContentLoaded',function(){
  if(window.lucide){try{lucide.createIcons();}catch(e){}}
  var t=document.querySelector('[data-dom-id="theme-toggle"]');
  if(!t)return;
  t.addEventListener('click',function(){
    var h=document.documentElement;var dark=h.classList.contains('dark');
    h.classList.toggle('dark',!dark);h.classList.toggle('light',dark);
    t.setAttribute('aria-pressed',String(!dark));
    t.querySelectorAll('[data-lucide]').forEach(function(el){el.setAttribute('data-lucide',!dark?'sun':'moon');});
    if(window.lucide){try{lucide.createIcons();}catch(e){}}
  });
  // 密码显隐
  var eb=document.querySelector('[data-dom-id="toggle-pwd-visibility"]');var ei=document.querySelector('[data-dom-id="input-pwd"]');
  if(eb&&ei){eb.addEventListener('click',function(){var pwd=ei.type==='password';ei.type=pwd?'text':'password';eb.querySelector('[data-lucide]').setAttribute('data-lucide',pwd?'eye-off':'eye');if(window.lucide){try{lucide.createIcons();}catch(e){}}});}
});
    </script>
</body>
</html>
