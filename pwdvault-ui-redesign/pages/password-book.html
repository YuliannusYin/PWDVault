/* ═══════════════════════════════════════════════════════════════
   PwdVault — Brand Design Tokens
   视觉路线：自由品牌化（保险库气质）  强调色：信任蓝
   主题：深浅双模式（默认深色，顶栏切换）
   字体：Segoe UI Variable（Windows 桌面应用）
   ═══════════════════════════════════════════════════════════════ */

/* ── 浅色主题（默认 :root） ── */
:root {
  --pv-background: #f5f8fc;
  --pv-foreground: #0f1626;

  --pv-card: #ffffff;
  --pv-card-foreground: #0f1626;

  --pv-popover: #ffffff;
  --pv-popover-foreground: #0f1626;

  --pv-sidebar: #ffffff;
  --pv-sidebar-foreground: #0f1626;
  --pv-sidebar-border: #e6ebf3;

  --pv-primary: #2f5fff;
  --pv-primary-foreground: #ffffff;

  --pv-muted: #eef2f8;
  --pv-muted-foreground: #5c6678;

  --pv-border: #e2e8f2;
  --pv-input: #ffffff;
  --pv-ring: #2f5fff;

  /* 选中态/悬停态：仅用主色透明度，不引入第二品牌色相 */
  --pv-accent: rgba(47, 95, 255, 0.10);
  --pv-accent-strong: rgba(47, 95, 255, 0.16);
  --pv-accent-foreground: #0f1626;

  /* 语义状态色（仅用于真实状态） */
  --pv-success: #1f9d57;
  --pv-success-foreground: #ffffff;
  --pv-success-soft: rgba(31, 157, 87, 0.12);
  --pv-warning: #c9820a;
  --pv-warning-foreground: #ffffff;
  --pv-warning-soft: rgba(201, 130, 10, 0.12);
  --pv-error: #dc2626;
  --pv-error-foreground: #ffffff;
  --pv-error-soft: rgba(220, 38, 38, 0.12);
  --pv-info: #2f5fff;
  --pv-info-soft: rgba(47, 95, 255, 0.12);

  /* 圆角 */
  --pv-radius-sm: 6px;
  --pv-radius-md: 8px;
  --pv-radius-lg: 12px;
  --pv-radius-full: 9999px;

  /* 字体 */
  --pv-font-sans: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system,
    "Helvetica Neue", Arial, sans-serif;
  --pv-font-mono: "Cascadia Code", "SFMono-Regular", "Consolas", monospace;

  /* 阴影：浮层（弹窗/下拉/抽屉）专用，静态卡片用边框分层 */
  --pv-shadow-popover: 0 8px 24px -6px rgba(15, 22, 38, 0.18),
    0 2px 8px -2px rgba(15, 22, 38, 0.08);
  --pv-shadow-overlay: 0 24px 56px -12px rgba(15, 22, 38, 0.32),
    0 8px 24px -8px rgba(15, 22, 38, 0.16);

  /* 尺寸 */
  --pv-sidebar-width: 232px;
  --pv-topbar-height: 56px;
}

/* ── 深色主题（保险库氛围，<html class="dark">） ── */
.dark {
  --pv-background: #0a0e1a;
  --pv-foreground: #e8ecf4;

  --pv-card: #121829;
  --pv-card-foreground: #e8ecf4;

  --pv-popover: #161e33;
  --pv-popover-foreground: #e8ecf4;

  --pv-sidebar: #0d1322;
  --pv-sidebar-foreground: #e8ecf4;
  --pv-sidebar-border: #1e2740;

  --pv-primary: #3b6bff;
  --pv-primary-foreground: #ffffff;

  --pv-muted: #1a2238;
  --pv-muted-foreground: #8b95a8;

  --pv-border: #232c44;
  --pv-input: #1a2238;
  --pv-ring: #3b6bff;

  --pv-accent: rgba(59, 107, 255, 0.16);
  --pv-accent-strong: rgba(59, 107, 255, 0.24);
  --pv-accent-foreground: #e8ecf4;

  --pv-success: #2bd576;
  --pv-success-foreground: #06281a;
  --pv-success-soft: rgba(43, 213, 118, 0.14);
  --pv-warning: #f0a93c;
  --pv-warning-foreground: #2a1a02;
  --pv-warning-soft: rgba(240, 169, 60, 0.14);
  --pv-error: #f56363;
  --pv-error-foreground: #2a0808;
  --pv-error-soft: rgba(245, 99, 99, 0.14);
  --pv-info: #3b6bff;
  --pv-info-soft: rgba(59, 107, 255, 0.16);

  --pv-shadow-popover: 0 8px 24px -6px rgba(0, 0, 0, 0.55),
    0 2px 8px -2px rgba(0, 0, 0, 0.4);
  --pv-shadow-overlay: 0 24px 56px -12px rgba(0, 0, 0, 0.7),
    0 8px 24px -8px rgba(0, 0, 0, 0.5);
}

/* ── 基础排版 ── */
html,
body {
  font-family: var(--pv-font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* 滚动条：贴合桌面应用，纤细低调 */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--pv-border) transparent;
}
*::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
*::-webkit-scrollbar-thumb {
  background: var(--pv-border);
  border-radius: var(--pv-radius-full);
}
*::-webkit-scrollbar-track {
  background: transparent;
}

/* 主题切换微动画 */
.theme-anim,
.theme-anim * {
  transition: background-color 0.18s ease, border-color 0.18s ease,
    color 0.18s ease;
}

    <script>
document.addEventListener('DOMContentLoaded', function () {
  if (window.lucide) { try { lucide.createIcons(); } catch (e) {} }

  // Theme toggle (dark <-> light)
  var themeBtn = document.querySelector('[data-dom-id="theme-toggle"]');
  if (themeBtn) {
    themeBtn.addEventListener('click', function () {
      var html = document.documentElement;
      var dark = html.classList.contains('dark');
      html.classList.toggle('dark', !dark);
      html.classList.toggle('light', dark);
      themeBtn.setAttribute('aria-pressed', String(!dark));
      var newDark = !dark;
      var sun = themeBtn.querySelector('.js-theme-sun');
      var moon = themeBtn.querySelector('.js-theme-moon');
      if (sun) { sun.classList.toggle('hidden', !newDark); }
      if (moon) { moon.classList.toggle('hidden', newDark); }
    });
  }

  // Password visibility toggle
  var pwdBtn = document.querySelector('[data-dom-id="toggle-pwd-visibility"]');
  var pwdVal = document.querySelector('[data-pwd-value]');
  if (pwdBtn) {
    var masked = true;
    var MASK = '••••••••••••';
    var PLAIN = 'Gh7$kP9m!Q2v';
    pwdBtn.addEventListener('click', function () {
      masked = !masked;
      if (pwdVal) { pwdVal.textContent = masked ? MASK : PLAIN; }
      var eye = pwdBtn.querySelector('.js-pwd-eye');
      var eyeOff = pwdBtn.querySelector('.js-pwd-eye-off');
      if (eye) { eye.classList.toggle('hidden', !masked); }
      if (eyeOff) { eyeOff.classList.toggle('hidden', masked); }
      pwdBtn.setAttribute('aria-label', masked ? '显示密码' : '隐藏密码');
    });
  }
});
    </script>
