    <style id="theme-vars">
/* ═══════════════════════════════════════════════════════════════
   PwdVault — Brand Design Tokens
   视觉路线：自由品牌化（保险库气质）  强调色：信任蓝
   主题：深浅双模式（默认深色，顶栏切换）
   字体：Segoe UI Variable（Windows 桌面应用）
   ═══════════════════════════════════════════════════════════════ */

/* ── 浅色主题（默认 :root） ── */
:root {
  --pv-background: #f5f8fc;
  --pv-foreground: #0f1626;

  --pv-card: #ffffff;
  --pv-card-foreground: #0f1626;

  --pv-popover: #ffffff;
  --pv-popover-foreground: #0f1626;

  --pv-sidebar: #ffffff;
  --pv-sidebar-foreground: #0f1626;
  --pv-sidebar-border: #e6ebf3;

  --pv-primary: #2f5fff;
  --pv-primary-foreground: #ffffff;

  --pv-muted: #eef2f8;
  --pv-muted-foreground: #5c6678;

  --pv-border: #e2e8f2;
  --pv-input: #ffffff;
  --pv-ring: #2f5fff;

  /* 选中态/悬停态：仅用主色透明度，不引入第二品牌色相 */
  --pv-accent: rgba(47, 95, 255, 0.10);
  --pv-accent-strong: rgba(47, 95, 255, 0.16);
  --pv-accent-foreground: #0f1626;

  /* 语义状态色（仅用于真实状态） */
  --pv-success: #1f9d57;
  --pv-success-foreground: #ffffff;
  --pv-success-soft: rgba(31, 157, 87, 0.12);
  --pv-warning: #c9820a;
  --pv-warning-foreground: #ffffff;
  --pv-warning-soft: rgba(201, 130, 10, 0.12);
  --pv-error: #dc2626;
  --pv-error-foreground: #ffffff;
  --pv-error-soft: rgba(220, 38, 38, 0.12);
  --pv-info: #2f5fff;
  --pv-info-soft: rgba(47, 95, 255, 0.12);

  /* 圆角 */
  --pv-radius-sm: 6px;
  --pv-radius-md: 8px;
  --pv-radius-lg: 12px;
  --pv-radius-full: 9999px;

  /* 字体 */
  --pv-font-sans: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system,
    "Helvetica Neue", Arial, sans-serif;
  --pv-font-mono: "Cascadia Code", "SFMono-Regular", "Consolas", monospace;

  /* 阴影：浮层（弹窗/下拉/抽屉）专用，静态卡片用边框分层 */
  --pv-shadow-popover: 0 8px 24px -6px rgba(15, 22, 38, 0.18),
    0 2px 8px -2px rgba(15, 22, 38, 0.08);
  --pv-shadow-overlay: 0 24px 56px -12px rgba(15, 22, 38, 0.32),
    0 8px 24px -8px rgba(15, 22, 38, 0.16);

  /* 尺寸 */
  --pv-sidebar-width: 232px;
  --pv-topbar-height: 56px;
}

/* ── 深色主题（保险库氛围，<html class="dark">） ── */
.dark {
  --pv-background: #0a0e1a;
  --pv-foreground: #e8ecf4;

  --pv-card: #121829;
  --pv-card-foreground: #e8ecf4;

  --pv-popover: #161e33;
  --pv-popover-foreground: #e8ecf4;

  --pv-sidebar: #0d1322;
  --pv-sidebar-foreground: #e8ecf4;
  --pv-sidebar-border: #1e2740;

  --pv-primary: #3b6bff;
  --pv-primary-foreground: #ffffff;

  --pv-muted: #1a2238;
  --pv-muted-foreground: #8b95a8;

  --pv-border: #232c44;
  --pv-input: #1a2238;
  --pv-ring: #3b6bff;

  --pv-accent: rgba(59, 107, 255, 0.16);
  --pv-accent-strong: rgba(59, 107, 255, 0.24);
  --pv-accent-foreground: #e8ecf4;

  --pv-success: #2bd576;
  --pv-success-foreground: #06281a;
  --pv-success-soft: rgba(43, 213, 118, 0.14);
  --pv-warning: #f0a93c;
  --pv-warning-foreground: #2a1a02;
  --pv-warning-soft: rgba(240, 169, 60, 0.14);
  --pv-error: #f56363;
  --pv-error-foreground: #2a0808;
  --pv-error-soft: rgba(245, 99, 99, 0.14);
  --pv-info: #3b6bff;
  --pv-info-soft: rgba(59, 107, 255, 0.16);

  --pv-shadow-popover: 0 8px 24px -6px rgba(0, 0, 0, 0.55),
    0 2px 8px -2px rgba(0, 0, 0, 0.4);
  --pv-shadow-overlay: 0 24px 56px -12px rgba(0, 0, 0, 0.7),
    0 8px 24px -8px rgba(0, 0, 0, 0.5);
}

/* ── 基础排版 ── */
html,
body {
  font-family: var(--pv-font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* 滚动条：贴合桌面应用，纤细低调 */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--pv-border) transparent;
}
*::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
*::-webkit-scrollbar-thumb {
  background: var(--pv-border);
  border-radius: var(--pv-radius-full);
}
*::-webkit-scrollbar-track {
  background: transparent;
}

/* 主题切换微动画 */
.theme-anim,
.theme-anim * {
  transition: background-color 0.18s ease, border-color 0.18s ease,
    color 0.18s ease;
}

<body class="min-h-screen font-sans antialiased">
    <main>
    <div class="h-screen flex overflow-hidden bg-background min-h-0" data-viewport-mode="app-shell">
      <!-- Sidebar -->
      <aside class="w-[232px] bg-[var(--pv-sidebar)] border-r border-[var(--pv-sidebar-border)] flex flex-col shrink-0">
        <!-- Brand -->
        <div class="px-[18px] py-5 flex items-center gap-2.5">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--pv-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
          <span class="text-[15px] font-semibold text-foreground">PwdVault</span>
        </div>
        <!-- Navigation -->
        <nav class="px-3 py-3 space-y-1 flex-1">
          <button data-dom-id="nav-book" class="w-full h-10 rounded-md px-3 flex items-center gap-3 text-sm text-muted-foreground hover:bg-muted transition-colors">
            <i data-lucide="key-round" class="w-[18px] h-[18px] shrink-0"></i>
            <span class="truncate">密码本</span>
          </button>
          <button data-dom-id="nav-input" class="w-full h-10 rounded-md px-3 flex items-center gap-3 text-sm text-muted-foreground hover:bg-muted transition-colors">
            <i data-lucide="file-plus-2" class="w-[18px] h-[18px] shrink-0"></i>
            <span class="truncate">录入</span>
          </button>
          <button data-dom-id="nav-generator" class="relative w-full h-10 rounded-md px-3 flex items-center gap-3 text-sm bg-accent text-foreground transition-colors">
            <span class="absolute left-0 top-1/2 -translate-y-1/2 w-[3px] h-5 rounded-full bg-[var(--pv-primary)]"></span>
            <i data-lucide="wand-2" class="w-[18px] h-[18px] shrink-0"></i>
            <span class="truncate">生成器</span>
          </button>
          <button data-dom-id="nav-settings" class="w-full h-10 rounded-md px-3 flex items-center gap-3 text-sm text-muted-foreground hover:bg-muted transition-colors">
            <i data-lucide="settings" class="w-[18px] h-[18px] shrink-0"></i>
            <span class="truncate">设置</span>
          </button>
        </nav>
        <!-- Bottom Status + Lock -->
        <div class="mt-auto px-[18px] py-4 border-t border-[var(--pv-sidebar-border)]">
          <div class="flex items-center gap-2 text-xs text-muted-foreground">
            <span class="w-2 h-2 rounded-full bg-[var(--pv-success)] shrink-0"></span>
            <span class="truncate">服务已连接</span>
          </div>
          <button data-dom-id="action-lock" class="w-full mt-3 h-9 bg-transparent border border-border text-foreground rounded-md flex items-center justify-center gap-2 text-sm hover:bg-muted transition-colors">
            <i data-lucide="lock" class="w-[16px] h-[16px] shrink-0"></i>
            <span>锁定保险库</span>
          </button>
        </div>
      </aside>

      <!-- Main Area -->
      <div class="flex-1 flex flex-col min-w-0">
        <!-- Topbar -->
        <header class="h-14 px-6 flex items-center justify-between border-b border-border shrink-0">
          <div class="flex items-center min-w-0">
            <h1 class="text-base font-semibold truncate">密码生成器</h1>
            <span class="ml-3 text-[13px] text-muted-foreground truncate">本地随机 · BCryptGenRandom</span>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button data-dom-id="theme-toggle" class="w-9 h-9 flex items-center justify-center rounded-md text-muted-foreground hover:bg-muted hover:text-foreground transition-colors" title="切换主题" aria-pressed="true">

            </button>
            <button data-dom-id="action-lock" class="w-9 h-9 flex items-center justify-center rounded-md text-muted-foreground hover:bg-muted hover:text-foreground transition-colors" title="锁定保险库">
              <i data-lucide="lock" class="w-[18px] h-[18px]"></i>
            </button>
          </div>
        </header>

        <!-- Content Scroll Region -->
        <div class="flex-1 overflow-y-auto p-6 min-h-0" data-scroll-region="primary">
          <div class="max-w-[720px] mx-auto space-y-4">

            <!-- Result Card -->

                </button>
                <button data-dom-id="action-regenerate" class="shrink-0 p-2 rounded-md text-muted-foreground hover:bg-muted hover:text-foreground transition-colors" title="重新生成" aria-label="重新生成">
                  <i data-lucide="refresh-cw" class="w-[18px] h-[18px]"></i>
                </button>
              </div>
              <!-- Strength Bar -->

                  <div class="flex-1 h-1.5 rounded-full bg-[var(--pv-success)]"></div>
                  <div class="flex-1 h-1.5 rounded-full bg-[var(--pv-success)]"></div>

                </div>

              </div>

                <div class="flex justify-between text-xs text-muted-foreground mt-1">
                  <span>8</span>
                  <span>40</span>

                      <span class="absolute top-[1px] left-[1px] h-3 w-3 rounded-full bg-primary-foreground transition-transform peer-checked:translate-x-[8px]"></span>
                    </span>
                    <span class="text-sm truncate">大写 A-Z</span>

                      <span class="absolute inset-0 rounded-full bg-[var(--pv-border)] peer-checked:bg-primary transition-colors"></span>
                      <span class="absolute top-[1px] left-[1px] h-3 w-3 rounded-full bg-primary-foreground transition-transform peer-checked:translate-x-[8px]"></span>
                    </span>
                    <span class="text-sm truncate">小写 a-z</span>

                  <!-- 数字 -->

                    <label class="flex items-center gap-2.5 cursor-pointer shrink-0">
                      <span class="relative inline-block h-[14px] w-[22px] shrink-0">

                        <span class="absolute inset-0 rounded-full bg-[var(--pv-border)] peer-checked:bg-primary transition-colors"></span>
                        <span class="absolute top-[1px] left-[1px] h-3 w-3 rounded-full bg-primary-foreground transition-transform peer-checked:translate-x-[8px]"></span>

                      <span class="text-sm whitespace-nowrap">自定义字符</span>
                    </label>
                    <input type="text" placeholder="如：-_~" class="flex-1 h-8 bg-input border border-border rounded-md px-2.5 text-sm min-w-0 focus:outline-none focus:ring-2 focus:ring-ring/40">
                  </div>
                </div>
                <!-- Full-width custom charset input -->
                <input type="text" placeholder="补充自定义字符（可选）" class="w-full h-10 bg-input border border-border rounded-md px-3 text-sm mt-2 focus:outline-none focus:ring-2 focus:ring-ring/40">
              </div>
            </section>

            <!-- Action Row -->
            <div class="flex gap-3">
              <button data-dom-id="action-regenerate-2" class="flex-1 h-11 bg-primary text-primary-foreground rounded-md flex items-center justify-center gap-2 text-sm font-medium hover:opacity-90 transition-opacity focus:outline-none focus:ring-2 focus:ring-ring/40">
                <i data-lucide="refresh-cw" class="w-[18px] h-[18px]"></i>
                <span>重新生成</span>
              </button>
              <button data-dom-id="action-copy-2" class="flex-1 h-11 bg-transparent border border-border text-foreground rounded-md flex items-center justify-center gap-2 text-sm font-medium hover:bg-muted transition-colors focus:outline-none focus:ring-2 focus:ring-ring/40">
                <i data-lucide="copy" class="w-[18px] h-[18px]"></i>
                <span>复制密码</span>
              </button>
            </div>

          </div>
        </div>
      </div>
    </div>
    </main>
    <style>
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}
    </style>
    <script>
document.addEventListener('DOMContentLoaded',function(){
  if(window.lucide){try{lucide.createIcons();}catch(e){}}
  var t=document.querySelector('[data-dom-id="theme-toggle"]');
  if(!t)return;
  t.addEventListener('click',function(){
    var h=document.documentElement;var dark=h.classList.contains('dark');
    h.classList.toggle('dark',!dark);h.classList.toggle('light',dark);
    t.setAttribute('aria-pressed',String(!dark));
    t.querySelectorAll('[data-lucide]').forEach(function(el){el.setAttribute('data-lucide',!dark?'sun':'moon');});
    if(window.lucide){try{lucide.createIcons();}catch(e){}}
  });
});
    </script>
</body>
</html>
