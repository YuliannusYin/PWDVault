<!DOCTYPE html>
<html lang="zh-CN" class="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解锁 · PwdVault</title>
    <style id="theme-vars">
/* ═══════════════════════════════════════════════════════════════
   PwdVault — Brand Design Tokens
   视觉路线：自由品牌化（保险库气质）  强调色：信任蓝
   主题：深浅双模式（默认深色，顶栏切换）
   字体：Segoe UI Variable（Windows 桌面应用）
   ═══════════════════════════════════════════════════════════════ */

/* ── 浅色主题（默认 :root） ── */
:root {
  --pv-background: #f5f8fc;
  --pv-foreground: #0f1626;

  --pv-card: #ffffff;
  --pv-card-foreground: #0f1626;

  --pv-popover: #ffffff;
  --pv-popover-foreground: #0f1626;

  --pv-sidebar: #ffffff;
  --pv-sidebar-foreground: #0f1626;
  --pv-sidebar-border: #e6ebf3;

  --pv-primary: #2f5fff;
  --pv-primary-foreground: #ffffff;

  --pv-muted: #eef2f8;
  --pv-muted-foreground: #5c6678;

  --pv-border: #e2e8f2;
  --pv-input: #ffffff;
  --pv-ring: #2f5fff;

  /* 选中态/悬停态：仅用主色透明度，不引入第二品牌色相 */
  --pv-accent: rgba(47, 95, 255, 0.10);
  --pv-accent-strong: rgba(47, 95, 255, 0.16);
  --pv-accent-foreground: #0f1626;

  /* 语义状态色（仅用于真实状态） */
  --pv-success: #1f9d57;
  --pv-success-foreground: #ffffff;
  --pv-success-soft: rgba(31, 157, 87, 0.12);
  --pv-warning: #c9820a;
  --pv-warning-foreground: #ffffff;
  --pv-warning-soft: rgba(201, 130, 10, 0.12);
  --pv-error: #dc2626;
  --pv-error-foreground: #ffffff;
  --pv-error-soft: rgba(220, 38, 38, 0.12);
  --pv-info: #2f5fff;
  --pv-info-soft: rgba(47, 95, 255, 0.12);

  /* 圆角 */
  --pv-radius-sm: 6px;
  --pv-radius-md: 8px;
  --pv-radius-lg: 12px;
  --pv-radius-full: 9999px;

  /* 字体 */
  --pv-font-sans: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system,
    "Helvetica Neue", Arial, sans-serif;
  --pv-font-mono: "Cascadia Code", "SFMono-Regular", "Consolas", monospace;

  /* 阴影：浮层（弹窗/下拉/抽屉）专用，静态卡片用边框分层 */
  --pv-shadow-popover: 0 8px 24px -6px rgba(15, 22, 38, 0.18),
    0 2px 8px -2px rgba(15, 22, 38, 0.08);
  --pv-shadow-overlay: 0 24px 56px -12px rgba(15, 22, 38, 0.32),
    0 8px 24px -8px rgba(15, 22, 38, 0.16);

  /* 尺寸 */
  --pv-sidebar-width: 232px;
  --pv-topbar-height: 56px;
}

/* ── 深色主题（保险库氛围，<html class="dark">） ── */
.dark {
  --pv-background: #0a0e1a;
  --pv-foreground: #e8ecf4;

  --pv-card: #121829;
  --pv-card-foreground: #e8ecf4;

  --pv-popover: #161e33;
  --pv-popover-foreground: #e8ecf4;

  --pv-sidebar: #0d1322;
  --pv-sidebar-foreground: #e8ecf4;
  --pv-sidebar-border: #1e2740;

  --pv-primary: #3b6bff;
  --pv-primary-foreground: #ffffff;

  --pv-muted: #1a2238;
  --pv-muted-foreground: #8b95a8;

  --pv-border: #232c44;
  --pv-input: #1a2238;
  --pv-ring: #3b6bff;

  --pv-accent: rgba(59, 107, 255, 0.16);
  --pv-accent-strong: rgba(59, 107, 255, 0.24);
  --pv-accent-foreground: #e8ecf4;

  --pv-success: #2bd576;
  --pv-success-foreground: #06281a;
  --pv-success-soft: rgba(43, 213, 118, 0.14);
  --pv-warning: #f0a93c;
  --pv-warning-foreground: #2a1a02;
  --pv-warning-soft: rgba(240, 169, 60, 0.14);
  --pv-error: #f56363;
  --pv-error-foreground: #2a0808;
  --pv-error-soft: rgba(245, 99, 99, 0.14);
  --pv-info: #3b6bff;
  --pv-info-soft: rgba(59, 107, 255, 0.16);

  --pv-shadow-popover: 0 8px 24px -6px rgba(0, 0, 0, 0.55),
    0 2px 8px -2px rgba(0, 0, 0, 0.4);
  --pv-shadow-overlay: 0 24px 56px -12px rgba(0, 0, 0, 0.7),
    0 8px 24px -8px rgba(0, 0, 0, 0.5);
}

/* ── 基础排版 ── */
html,
body {
  font-family: var(--pv-font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* 滚动条：贴合桌面应用，纤细低调 */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--pv-border) transparent;
}
*::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
*::-webkit-scrollbar-thumb {
  background: var(--pv-border);
  border-radius: var(--pv-radius-full);
}
*::-webkit-scrollbar-track {
  background: transparent;
}

/* 主题切换微动画 */
.theme-anim,
.theme-anim * {
  transition: background-color 0.18s ease, border-color 0.18s ease,
    color 0.18s ease;
}

    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }

<body class="min-h-screen font-sans antialiased">
    <main class="relative min-h-screen flex items-center justify-center overflow-hidden px-4">
        <div aria-hidden="true" class="pointer-events-none absolute inset-0" style="background: radial-gradient(circle at 50% 35%, rgba(59,107,255,0.18), transparent 60%);"></div>
        <div aria-hidden="true" class="pointer-events-none absolute inset-0" style="background-image: radial-gradient(circle, var(--pv-border) 1px, transparent 1px); background-size: 24px 24px; opacity: 0.5;"></div>
        <section class="relative z-10 w-[380px] max-w-full bg-card border border-border rounded-lg p-9 shadow-[var(--pv-shadow-overlay)]">
            <div class="flex justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--pv-primary)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="M10 11V9.5a2 2 0 0 1 4 0V11"/>
                    <rect x="9" y="11" width="6" height="4.5" rx="0.8"/>
                </svg>
            </div>
            <h1 class="mt-5 text-center font-semibold text-card-foreground" style="font-size:22px;letter-spacing:-0.01em;">PwdVault</h1>
            <p class="mt-1 text-center text-muted-foreground" style="font-size:13px;">输入程序密码以解锁保险库</p>
            <div class="relative mt-7">
                <i data-lucide="lock" class="w-[18px] h-[18px] absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground pointer-events-none"></i>
                <input data-dom-id="input-unlock-password" type="password" placeholder="程序密码" aria-label="程序密码" class="w-full h-11 pl-10 pr-10 bg-input border border-border rounded-md text-card-foreground placeholder:text-muted-foreground outline-none focus:ring-2 focus:ring-ring/40 transition" style="font-size:14px;" />
                <button data-dom-id="toggle-unlock-visibility" type="button" aria-label="显示或隐藏密码" class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center justify-center w-7 h-7 text-muted-foreground hover:text-card-foreground rounded-md focus:outline-none focus:ring-2 focus:ring-ring/40 transition">
                    <i data-lucide="eye" class="w-[18px] h-[18px]"></i>
                </button>
            </div>
            <div class="mt-3 flex items-center gap-2 text-muted-foreground" style="font-size:12px;">
                <i data-lucide="shield-check" class="w-[14px] h-[14px] shrink-0"></i>
                <span class="truncate">连续 5 次失败将锁定 5 分钟</span>
                <span class="ml-auto tabular-nums whitespace-nowrap">剩余尝试 5/5</span>
            </div>
            <button data-dom-id="action-unlock" type="button" class="mt-5 w-full h-11 bg-primary text-primary-foreground rounded-md font-medium flex items-center justify-center gap-2 hover:brightness-110 active:brightness-95 focus:outline-none focus:ring-2 focus:ring-ring/40 transition" style="font-size:14px;">
                <i data-lucide="lock-open" class="w-[18px] h-[18px]"></i>
                <span>解锁</span>
            </button>
            <div class="mt-7 pt-5 border-t border-border flex items-center justify-center gap-1.5 text-muted-foreground" style="font-size:11px;">
                <i data-lucide="shield" class="w-[12px] h-[12px]"></i>
                <span class="whitespace-nowrap">本地加密 · AES-256-GCM · Argon2id</span>
            </div>
        </section>
    </main>
    <script>
document.addEventListener('DOMContentLoaded',function(){
  if(window.lucide){try{lucide.createIcons();}catch(e){}}
  var b=document.querySelector('[data-dom-id="toggle-unlock-visibility"]');
  var i=document.querySelector('[data-dom-id="input-unlock-password"]');
  if(b&&i){b.addEventListener('click',function(){var pwd=i.type==='password';i.type=pwd?'text':'password';b.querySelector('[data-lucide]').setAttribute('data-lucide',pwd?'eye-off':'eye');if(window.lucide){try{lucide.createIcons();}catch(e){}}});}
});
    </script>
</body>
