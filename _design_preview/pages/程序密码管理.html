<!DOCTYPE html>
<html lang="zh-CN" class="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>程序密码管理 · PwdVault</title>
    <style id="theme-vars">
/* ═══════════════════════════════════════════════════════════════
   PwdVault — Brand Design Tokens
   视觉路线：自由品牌化（保险库气质）  强调色：信任蓝
   主题：深浅双模式（默认深色，顶栏切换）
   字体：Segoe UI Variable（Windows 桌面应用）
   ═══════════════════════════════════════════════════════════════ */

/* ── 浅色主题（默认 :root） ── */
:root {
  --pv-background: #f5f8fc;
  --pv-foreground: #0f1626;

  --pv-card: #ffffff;
  --pv-card-foreground: #0f1626;

  --pv-popover: #ffffff;
  --pv-popover-foreground: #0f1626;

  --pv-sidebar: #ffffff;
  --pv-sidebar-foreground: #0f1626;
  --pv-sidebar-border: #e6ebf3;

  --pv-primary: #2f5fff;
  --pv-primary-foreground: #ffffff;

  --pv-muted: #eef2f8;
  --pv-muted-foreground: #5c6678;

  --pv-border: #e2e8f2;
  --pv-input: #ffffff;
  --pv-ring: #2f5fff;

  /* 选中态/悬停态：仅用主色透明度，不引入第二品牌色相 */
  --pv-accent: rgba(47, 95, 255, 0.10);
  --pv-accent-strong: rgba(47, 95, 255, 0.16);
  --pv-accent-foreground: #0f1626;

  /* 语义状态色（仅用于真实状态） */
  --pv-success: #1f9d57;
  --pv-success-foreground: #ffffff;
  --pv-success-soft: rgba(31, 157, 87, 0.12);
  --pv-warning: #c9820a;
  --pv-warning-foreground: #ffffff;
  --pv-warning-soft: rgba(201, 130, 10, 0.12);
  --pv-error: #dc2626;
  --pv-error-foreground: #ffffff;
  --pv-error-soft: rgba(220, 38, 38, 0.12);
  --pv-info: #2f5fff;
  --pv-info-soft: rgba(47, 95, 255, 0.12);

  /* 圆角 */
  --pv-radius-sm: 6px;
  --pv-radius-md: 8px;
  --pv-radius-lg: 12px;
  --pv-radius-full: 9999px;

  /* 字体 */
  --pv-font-sans: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system,
    "Helvetica Neue", Arial, sans-serif;
  --pv-font-mono: "Cascadia Code", "SFMono-Regular", "Consolas", monospace;

  /* 阴影：浮层（弹窗/下拉/抽屉）专用，静态卡片用边框分层 */
  --pv-shadow-popover: 0 8px 24px -6px rgba(15, 22, 38, 0.18),
    0 2px 8px -2px rgba(15, 22, 38, 0.08);
  --pv-shadow-overlay: 0 24px 56px -12px rgba(15, 22, 38, 0.32),
    0 8px 24px -8px rgba(15, 22, 38, 0.16);

  /* 尺寸 */
  --pv-sidebar-width: 232px;
  --pv-topbar-height: 56px;
}

/* ── 深色主题（保险库氛围，<html class="dark">） ── */
.dark {
  --pv-background: #0a0e1a;
  --pv-foreground: #e8ecf4;

  --pv-card: #121829;
  --pv-card-foreground: #e8ecf4;

  --pv-popover: #161e33;
  --pv-popover-foreground: #e8ecf4;

  --pv-sidebar: #0d1322;
  --pv-sidebar-foreground: #e8ecf4;
  --pv-sidebar-border: #1e2740;

  --pv-primary: #3b6bff;
  --pv-primary-foreground: #ffffff;

  --pv-muted: #1a2238;
  --pv-muted-foreground: #8b95a8;

  --pv-border: #232c44;
  --pv-input: #1a2238;
  --pv-ring: #3b6bff;

  --pv-accent: rgba(59, 107, 255, 0.16);
  --pv-accent-strong: rgba(59, 107, 255, 0.24);
  --pv-accent-foreground: #e8ecf4;

  --pv-success: #2bd576;
  --pv-success-foreground: #06281a;
  --pv-success-soft: rgba(43, 213, 118, 0.14);
  --pv-warning: #f0a93c;
  --pv-warning-foreground: #2a1a02;
  --pv-warning-soft: rgba(240, 169, 60, 0.14);
  --pv-error: #f56363;
  --pv-error-foreground: #2a0808;
  --pv-error-soft: rgba(245, 99, 99, 0.14);
  --pv-info: #3b6bff;
  --pv-info-soft: rgba(59, 107, 255, 0.16);

  --pv-shadow-popover: 0 8px 24px -6px rgba(0, 0, 0, 0.55),
    0 2px 8px -2px rgba(0, 0, 0, 0.4);
  --pv-shadow-overlay: 0 24px 56px -12px rgba(0, 0, 0, 0.7),
    0 8px 24px -8px rgba(0, 0, 0, 0.5);
}

/* ── 基础排版 ── */
html,
body {
  font-family: var(--pv-font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* 滚动条：贴合桌面应用，纤细低调 */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--pv-border) transparent;
}
*::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
*::-webkit-scrollbar-thumb {
  background: var(--pv-border);
  border-radius: var(--pv-radius-full);
}
*::-webkit-scrollbar-track {
  background: transparent;
}

/* 主题切换微动画 */
.theme-anim,
.theme-anim * {
  transition: background-color 0.18s ease, border-color 0.18s ease,
    color 0.18s ease;
}

<body class="min-h-screen font-sans antialiased">
    <main>
      <!-- ============ 设置外壳（被遮罩调暗，仅作背景） ============ -->
      <div data-viewport-mode="app-shell" class="h-screen flex overflow-hidden min-h-0 bg-background">
        <!-- SIDEBAR -->
        <aside class="w-[232px] shrink-0 bg-[var(--pv-sidebar)] border-r border-[var(--pv-sidebar-border)] flex flex-col">
          <!-- Brand -->
          <div class="px-[18px] py-5 flex items-center gap-2.5">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--pv-primary)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
            <span class="text-[15px] font-semibold text-[var(--pv-sidebar-foreground)]">PwdVault</span>
          </div>
          <!-- Nav -->
          <nav class="px-3 py-3 space-y-1">
            <button data-dom-id="nav-book" class="w-full h-10 rounded-md px-3 flex items-center gap-3 text-sm text-muted-foreground hover:bg-muted hover:text-foreground transition">
              <i data-lucide="key-round" class="w-[18px] h-[18px]"></i>
              <span>密码本</span>
            </button>
            <button data-dom-id="nav-input" class="w-full h-10 rounded-md px-3 flex items-center gap-3 text-sm text-muted-foreground hover:bg-muted hover:text-foreground transition">
              <i data-lucide="file-plus-2" class="w-[18px] h-[18px]"></i>
              <span>录入</span>
            </button>
            <button data-dom-id="nav-generator" class="w-full h-10 rounded-md px-3 flex items-center gap-3 text-sm text-muted-foreground hover:bg-muted hover:text-foreground transition">
              <i data-lucide="wand-2" class="w-[18px] h-[18px]"></i>
              <span>生成器</span>
            </button>
            <button data-dom-id="nav-settings" class="relative w-full h-10 rounded-md px-3 flex items-center gap-3 text-sm text-foreground bg-accent transition">
              <span class="absolute left-0 top-1/2 -translate-y-1/2 h-5 w-[3px] rounded-full bg-[var(--pv-primary)]" aria-hidden="true"></span>
              <i data-lucide="settings" class="w-[18px] h-[18px] text-[var(--pv-primary)]"></i>
              <span>设置</span>
            </button>
          </nav>
          <!-- Bottom -->
          <div class="mt-auto px-[18px] py-4 border-t border-[var(--pv-sidebar-border)]">
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-[var(--pv-success)]"></span>
              <span class="text-xs text-muted-foreground">服务已连接</span>
            </div>
            <button data-dom-id="action-lock" class="w-full mt-3 h-9 rounded-md px-3 flex items-center justify-center gap-2 text-sm text-muted-foreground hover:bg-muted hover:text-foreground border border-[var(--pv-sidebar-border)] transition">
              <i data-lucide="lock" class="w-[18px] h-[18px]"></i>
              <span>锁定保险库</span>
            </button>
          </div>
        </aside>

        <!-- MAIN -->
        <div class="flex-1 flex flex-col min-w-0">
          <!-- TOPBAR -->
          <header class="h-14 shrink-0 px-6 flex items-center justify-between border-b border-border bg-background">
            <h1 class="text-[16px] font-semibold text-foreground truncate">设置</h1>
            <div class="flex items-center gap-2 shrink-0">
              <button data-dom-id="theme-toggle" aria-pressed="true" class="w-9 h-9 flex items-center justify-center rounded-md hover:bg-muted text-muted-foreground hover:text-foreground transition" aria-label="切换主题">
                <i data-lucide="sun" class="w-[18px] h-[18px]"></i>
              </button>
              <button data-dom-id="action-lock" class="w-9 h-9 flex items-center justify-center rounded-md hover:bg-muted text-muted-foreground hover:text-foreground transition" aria-label="锁定">
                <i data-lucide="lock" class="w-[18px] h-[18px]"></i>
              </button>
            </div>
          </header>

          <!-- CONTENT（设置占位，背景烘托） -->
          <div class="flex-1 min-h-0 overflow-hidden p-6" data-scroll-region="primary">
            <div class="max-w-2xl space-y-4">
              <!-- 安全 -->
              <section class="bg-card border border-border rounded-lg p-5">
                <h2 class="text-sm font-semibold text-card-foreground">安全</h2>
                <p class="text-xs text-muted-foreground mt-1 mb-2">管理程序密码与加密设置。</p>
                <div class="flex items-center justify-between gap-3 py-3 border-t border-border">
                  <div class="min-w-0">
                    <div class="text-sm text-card-foreground truncate">程序密码</div>
                    <div class="text-xs text-muted-foreground truncate">已启用 · 用于派生加密密钥</div>
                  </div>
                  <span class="shrink-0 text-xs px-2 py-0.5 rounded-full bg-[var(--pv-success-soft)] text-[var(--pv-success)] whitespace-nowrap">已启用</span>
                </div>
                <div class="flex items-center justify-between gap-3 py-3 border-t border-border">
                  <div class="min-w-0">
                    <div class="text-sm text-card-foreground truncate">自动锁定</div>
                    <div class="text-xs text-muted-foreground truncate">空闲一段时间后锁定保险库</div>
                  </div>
                  <span class="shrink-0 text-xs text-muted-foreground whitespace-nowrap">5 分钟</span>
                </div>
              </section>
              <!-- 关于 -->
              <section class="bg-card border border-border rounded-lg p-5">
                <h2 class="text-sm font-semibold text-card-foreground">关于</h2>
                <p class="text-xs text-muted-foreground mt-1 mb-2">版本与许可信息。</p>
                <div class="flex items-center justify-between gap-3 py-3 border-t border-border">
                  <span class="text-sm text-card-foreground truncate">版本</span>
                  <span class="text-xs text-muted-foreground whitespace-nowrap">PwdVault 1.4.0</span>
                </div>
                <div class="flex items-center justify-between gap-3 py-3 border-t border-border">
                  <span class="text-sm text-card-foreground truncate">许可</span>
                  <span class="text-xs text-muted-foreground whitespace-nowrap">MIT</span>
                </div>
              </section>
            </div>
          </div>
        </div>
      </div>

      <!-- ============ 遮罩层 z-40 ============ -->
      <div class="fixed inset-0 bg-black/55 backdrop-blur-[2px] z-40" aria-hidden="true"></div>

      <!-- ============ 程序密码管理弹窗 z-50 ============ -->
      <div class="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="pp-title">
        <div class="w-full max-w-[480px] bg-popover border border-border rounded-lg shadow-[var(--pv-shadow-overlay)] overflow-hidden flex flex-col max-h-[88vh]">
          <!-- 头部 -->
          <div class="px-6 h-14 shrink-0 flex items-center justify-between border-b border-border">
            <div class="flex items-center gap-2.5 min-w-0">
              <i data-lucide="key-round" class="w-[18px] h-[18px] text-[var(--pv-primary)] shrink-0"></i>
              <h2 id="pp-title" class="text-[15px] font-semibold text-popover-foreground truncate">管理程序密码</h2>
            </div>
            <button data-dom-id="modal-pp-close" type="button" class="shrink-0 w-9 h-9 flex items-center justify-center rounded-md text-muted-foreground hover:bg-muted hover:text-foreground transition" aria-label="关闭">
              <i data-lucide="x" class="w-[18px] h-[18px]"></i>
            </button>
          </div>

          <!-- 模式分段控件 -->
          <div class="px-6 pt-4 shrink-0">
            <div data-dom-id="modal-pp-mode" class="flex p-1 bg-muted rounded-md text-sm" role="tablist">
              <button type="button" class="flex-1 h-9 rounded-md text-muted-foreground hover:text-foreground transition" role="tab">启用</button>
              <button type="button" class="flex-1 h-9 rounded-md bg-primary text-primary-foreground font-medium transition" role="tab" aria-selected="true">修改</button>
              <button type="button" class="flex-1 h-9 rounded-md text-muted-foreground hover:text-foreground transition" role="tab">禁用</button>
            </div>
          </div>

          <!-- 体 -->
          <div class="px-6 py-5 space-y-4 overflow-y-auto" data-scroll-region="primary">
            <!-- 当前程序密码 -->
            <div>
              <label for="pp-current-input" class="block text-sm font-medium mb-1.5 text-popover-foreground">当前程序密码</label>
              <div class="relative">
                <i data-lucide="lock" class="w-[18px] h-[18px] absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground pointer-events-none"></i>
                <input id="pp-current-input" data-dom-id="pp-current" type="password" placeholder="输入当前程序密码" class="h-10 w-full bg-input border border-border rounded-md pl-10 pr-10 text-sm text-popover-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring/40" />
                <button data-dom-id="pp-toggle-current" type="button" class="absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 flex items-center justify-center rounded-md text-muted-foreground hover:text-foreground transition" aria-label="显示密码">
                  <i data-lucide="eye" class="w-[18px] h-[18px]"></i>
                </button>
              </div>
            </div>

            <!-- 新程序密码 -->
            <div>
              <label for="pp-new-input" class="block text-sm font-medium mb-1.5 text-popover-foreground">新程序密码</label>
              <div class="relative">
                <i data-lucide="key" class="w-[18px] h-[18px] absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground pointer-events-none"></i>
                <input id="pp-new-input" data-dom-id="pp-new" type="password" placeholder="输入新程序密码" class="h-10 w-full bg-input border border-border rounded-md pl-10 pr-10 text-sm text-popover-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring/40" />
                <button data-dom-id="pp-toggle-new" type="button" class="absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 flex items-center justify-center rounded-md text-muted-foreground hover:text-foreground transition" aria-label="显示密码">
                  <i data-lucide="eye" class="w-[18px] h-[18px]"></i>
                </button>
              </div>
              <!-- 强度行 -->
              <div class="mt-2 flex items-center gap-2">
                <div class="flex-1 flex gap-1" aria-hidden="true">
                  <div class="flex-1 h-1.5 rounded-full bg-[var(--pv-warning)]"></div>
                  <div class="flex-1 h-1.5 rounded-full bg-[var(--pv-warning)]"></div>
                  <div class="flex-1 h-1.5 rounded-full bg-[var(--pv-warning)] opacity-30"></div>
                  <div class="flex-1 h-1.5 rounded-full bg-[var(--pv-warning)] opacity-30"></div>
                </div>
                <span class="text-xs text-[var(--pv-warning)] whitespace-nowrap">中</span>
              </div>
            </div>

            <!-- 确认新密码 -->
            <div>
              <label for="pp-confirm-input" class="block text-sm font-medium mb-1.5 text-popover-foreground">确认新密码</label>
              <div class="relative">
                <i data-lucide="shield-check" class="w-[18px] h-[18px] absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground pointer-events-none"></i>
                <input id="pp-confirm-input" data-dom-id="pp-confirm" type="password" placeholder="再次输入新密码" class="h-10 w-full bg-input border border-border rounded-md pl-10 pr-10 text-sm text-popover-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring/40" />
                <button data-dom-id="pp-toggle-confirm" type="button" class="absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 flex items-center justify-center rounded-md text-muted-foreground hover:text-foreground transition" aria-label="显示密码">
                  <i data-lucide="eye" class="w-[18px] h-[18px]"></i>
                </button>
              </div>
            </div>

            <!-- 提示条 -->
            <div class="flex items-start gap-2.5 p-3 rounded-md bg-[var(--pv-info-soft)] border border-[var(--pv-primary)]/20">
              <i data-lucide="info" class="w-4 h-4 text-[var(--pv-primary)] mt-0.5 shrink-0"></i>
              <p class="text-xs text-muted-foreground leading-relaxed">程序密码用于派生加密密钥（Argon2id）。修改后保险库将用新密钥重新加密，请妥善保管。</p>
            </div>
          </div>

          <!-- 尾部 -->
          <div class="px-6 h-16 shrink-0 flex items-center justify-end gap-3 border-t border-border">
            <button data-dom-id="modal-pp-cancel" type="button" class="h-10 px-4 rounded-md border border-border bg-transparent text-sm text-popover-foreground hover:bg-muted transition">取消</button>
            <button data-dom-id="modal-pp-confirm" type="button" class="h-10 px-5 rounded-md bg-primary text-primary-foreground text-sm font-medium inline-flex items-center gap-2 hover:opacity-90 transition">
              <i data-lucide="check" class="w-[18px] h-[18px]"></i>
              <span>确认修改</span>
            </button>
          </div>
        </div>
      </div>
    </main>
    <style>
      .lucide { stroke-width: 1.75; }
    </style>
    <script>
document.addEventListener('DOMContentLoaded',function(){
  if(window.lucide){try{lucide.createIcons();}catch(e){}}
  var t=document.querySelector('[data-dom-id="theme-toggle"]');
  if(t){t.addEventListener('click',function(){
    var h=document.documentElement;var dark=h.classList.contains('dark');
    h.classList.toggle('dark',!dark);h.classList.toggle('light',dark);
    t.setAttribute('aria-pressed',String(!dark));
    t.querySelectorAll('[data-lucide]').forEach(function(el){el.setAttribute('data-lucide',!dark?'sun':'moon');});
    if(window.lucide){try{lucide.createIcons();}catch(e){}}
  });}
  [['pp-toggle-current','pp-current'],['pp-toggle-new','pp-new'],['pp-toggle-confirm','pp-confirm']].forEach(function(p){
    var eb=document.querySelector('[data-dom-id="'+p[0]+'"]');var ei=document.querySelector('[data-dom-id="'+p[1]+'"]');
    if(eb&&ei){eb.addEventListener('click',function(){var pwd=ei.type==='password';ei.type=pwd?'text':'password';eb.querySelector('[data-lucide]').setAttribute('data-lucide',pwd?'eye-off':'eye');if(window.lucide){try{lucide.createIcons();}catch(e){}}});}
  });
});
    </script>
</body>
</html>
